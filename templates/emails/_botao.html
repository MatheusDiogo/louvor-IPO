{# Botão de e-mail. Uso: {% include "emails/_botao.html" with link=... texto=... %} #}
<table role="presentation" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td align="center" style="padding: 8px 0 24px;">
            <a href="{{ link }}" style="background-color: #166534; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-size: 15px; font-weight: 600; display: inline-block;">
                {{ texto }}
            </a>
        </td>
    </tr>
</table>
