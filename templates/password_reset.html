{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include "partials/pwa_head.html" %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Recuperar Senha | Louvor IPO</title>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>LOUVOR <span style="font-weight: 300; color: #1a2e1a;">IPO</span></h2>
                <p>Recuperação de senha</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="input-group-modern">
                    <i class="bi bi-envelope text-muted"></i>
                    <input type="email" name="email" placeholder="Seu e-mail" autocomplete="email"
                           autocapitalize="none" aria-label="E-mail" required>
                </div>
                {% if form.errors %}
                <div class="login-error" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span>Informe um e-mail válido.</span>
                </div>
                {% endif %}
                <button type="submit" class="btn-login">Enviar link</button>
            </form>
            <a href="{% url 'login' %}" class="login-link">Voltar ao login</a>
        </div>
    </div>
</body>
</html>
