<div class="btn-group btn-group-sm" role="group" aria-label="Tamanho da letra">
    <button type="button" class="btn btn-light border" data-cifra="menor" aria-label="Diminuir letra">A−</button>
    <button type="button" class="btn btn-light border" data-cifra="maior" aria-label="Aumentar letra">A+</button>
</div>
<button type="button" class="btn btn-sm btn-light border ativo" data-cifra="acordes" title="Mostrar/ocultar acordes">
    <i class="bi bi-music-note-beamed"></i><span class="d-none d-sm-inline ms-1">Acordes</span>
</button>
<button type="button" class="btn btn-sm btn-light border" data-cifra="cores" title="Cores da cifra (fundo, letra e acordes)">
    <i class="bi bi-palette"></i><span class="d-none d-sm-inline ms-1">Cores</span>
</button>
<button type="button" class="btn btn-sm btn-light border" data-cifra="tela" title="Manter a tela acesa">
    <i class="bi bi-brightness-high"></i><span class="d-none d-sm-inline ms-1">Tela acesa</span>
</button>
