{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#166534">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Login | Louvor IPO</title>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>LOUVOR <span style="font-weight: 300; color: #1a2e1a;">IPO</span></h2>
            </div>

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="input-group-modern">
                    <i class="bi bi-envelope text-muted"></i>
                    <input type="text" name="username" placeholder="E-mail" value="{{ email }}"
                           inputmode="email" autocomplete="username" autocapitalize="none"
                           autocorrect="off" spellcheck="false" aria-label="E-mail" required>
                </div>

                <div class="input-group-modern">
                    <i class="bi bi-lock text-muted"></i>
                    <input type="password" name="password" id="password" placeholder="Senha"
                           autocomplete="current-password" aria-label="Senha" required>
                    <i class="bi bi-eye toggle-password" onclick="togglePassword('password', this)"
                       role="button" aria-label="Mostrar senha"></i>
                </div>

                {% if erro %}
                <div class="login-error" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span>{{ erro }}</span>
                </div>
                {% endif %}

                <button type="submit" class="btn-login">Entrar</button>
                <a href="{% url 'password_reset' %}" class="login-link">Esqueci minha senha</a>
            </form>
        </div>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
